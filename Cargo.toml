[package]
name = "ultra_memo"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6"
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
png = "0.17"
rusqlite = { version = "0.31", features = ["bundled"] }
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Storage", "console"] }

[dev-dependencies]
tempfile = "3.10"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

